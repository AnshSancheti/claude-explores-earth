<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rendezvous - Two Friends, One City</title>
  <link rel="icon" type="image/png" href="/resources/orb.png">
  <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/rendezvous.css">
</head>
<body data-mobile-view="ada">
  <div class="rv-shell">
    <header class="rv-header">
      <div class="rv-brand">
        <video class="rv-brand-icon" autoplay loop muted playsinline>
          <source src="/resources/orb.webm" type="video/webm">
        </video>
        <h1>Rendezvous</h1>
      </div>
      <div class="rv-live-line" aria-live="polite">
        <span id="rvStatus">loading</span>
        <span class="rv-dot">·</span>
        <span id="rvDistance">--</span>
        <span class="rv-dot">·</span>
        <span>turn <span id="rvTurn">0</span></span>
      </div>
      <div class="rv-controls">
        <button id="compassOverlay" class="rv-icon-button" title="Unlock run controls" aria-label="Unlock run controls">
          <i data-lucide="key-round"></i>
        </button>
        <div id="controlButtons" class="rv-control-buttons hidden">
          <button id="rvStartBtn" class="rv-icon-button" title="Start" aria-label="Start"><i data-lucide="play"></i></button>
          <button id="rvStopBtn" class="rv-icon-button" title="Pause" aria-label="Pause"><i data-lucide="pause"></i></button>
          <button id="rvResetBtn" class="rv-icon-button danger" title="Start a new run" aria-label="Start a new run"><i data-lucide="rotate-ccw"></i></button>
        </div>
      </div>
    </header>

    <main class="rv-main">
      <article class="rv-agent-panel ada" data-mobile-panel="ada">
        <div class="rv-agent-topline">
          <h2 id="adaName">Ada</h2>
          <div class="rv-agent-meta">
            <span id="adaState">searching</span>
            <span id="adaStep">0 steps</span>
          </div>
        </div>
        <div id="streetAda" class="rv-street"></div>
        <p id="adaLastNote" class="rv-agent-note">Waiting for the first street view.</p>
      </article>

      <div class="rv-center">
        <section class="rv-scratchpad-section" data-mobile-panel="pad">
          <div class="rv-pad-heading">
            <div>
              <h2>The sheet</h2>
              <p id="rvPadStatus">waiting for a note</p>
            </div>
            <span id="rvPadSequence">blank</span>
          </div>
          <div id="rvPaper" class="rv-paper" aria-label="Latest sketched note">
            <svg id="rvScratchpad" viewBox="0 0 768 512" role="img" aria-label="The latest sketch one friend sent to the other"></svg>
          </div>
        </section>

        <section class="rv-map-section" data-mobile-panel="map">
          <div class="rv-map-heading">
            <div>
              <h2>Where they are</h2>
              <p>Observer view</p>
            </div>
            <button id="rvFitBtn" class="rv-icon-button quiet" title="Fit both trails" aria-label="Fit both trails"><i data-lucide="scan"></i></button>
          </div>
          <div id="rvMap" class="rv-map"></div>
        </section>
      </div>

      <article class="rv-agent-panel theo" data-mobile-panel="theo">
        <div class="rv-agent-topline">
          <h2 id="theoName">Theo</h2>
          <div class="rv-agent-meta">
            <span id="theoState">searching</span>
            <span id="theoStep">0 steps</span>
          </div>
        </div>
        <div id="streetTheo" class="rv-street"></div>
        <p id="theoLastNote" class="rv-agent-note">Waiting for the first street view.</p>
      </article>
    </main>

    <nav class="rv-mobile-tabs" aria-label="Rendezvous views">
      <button type="button" class="rv-mobile-tab active" data-mobile-view="ada"><i data-lucide="eye"></i><span>Ada</span></button>
      <button type="button" class="rv-mobile-tab" data-mobile-view="pad"><i data-lucide="notebook-pen"></i><span>Sheet</span></button>
      <button type="button" class="rv-mobile-tab" data-mobile-view="theo"><i data-lucide="eye"></i><span>Theo</span></button>
      <button type="button" class="rv-mobile-tab" data-mobile-view="map"><i data-lucide="map"></i><span>Map</span></button>
    </nav>
  </div>

  <div id="passwordModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Admin Authentication</h3>
        <button class="modal-close" onclick="AdminAuth.closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p>Enter admin password to control the rendezvous run.</p>
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
        <div id="authError" class="auth-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button onclick="AdminAuth.closeModal()" class="btn-cancel">Cancel</button>
        <button onclick="AdminAuth.authenticate()" class="btn-submit">Unlock</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/adminAuth.js"></script>
  <script src="js/rendezvous.js"></script>
  <script src="/api/maps-loader"></script>
</body>
</html>
